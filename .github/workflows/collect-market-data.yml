name: Collect market data

on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run collector tests
        run: python -m unittest discover -s tests -v

      - name: Collect market data
        id: collect
        continue-on-error: true
        run: python collector/collect.py

      - name: Commit data and audit logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data logs
          if git diff --cached --quiet; then
            echo "No new data or logs to commit."
          else
            git commit -m "data: archive daily market candles"
            git push
          fi

      - name: Report collection failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo "One or more feeds failed. Review logs/latest.json."
          exit 1
